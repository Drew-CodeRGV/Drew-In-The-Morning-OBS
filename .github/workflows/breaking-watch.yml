# Breaking watch: polls public RSS feeds, scores/dedupes, writes docs/breaking.json (the studio dashboard strip),
# and (only if configured) pushes to ntfy.sh and/or opens GitHub issues. Free on public repos.
#
# Setup (see BREAKING-WATCH.md):
#   - optional push:   repo secret NTFY_TOPIC (and NTFY_TOKEN only if your topic is protected)
#   - optional issues: repo variable BREAKING_ISSUES = true  (labels: breaking; created on first use)
# Never put a topic or token in this file or anywhere in the repo.
name: Breaking watch

on:
  schedule:
    # 5-11 AM Central every 15 minutes. The runner clock is UTC, so this covers CST (11-17 UTC) and
    # CDT (10-16 UTC); tools/breaking_watch.py skips runs outside 05:00-11:00 CT unless it is the top of the hour.
    - cron: "*/15 10-17 * * *"
    # Hourly the rest of the day.
    - cron: "0 0-9,18-23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (fetch + score, write nothing, send nothing)"
        type: boolean
        default: false
      bootstrap:
        description: "Bootstrap (record everything as already seen, send no alerts)"
        type: boolean
        default: false

# contents: commit state + breaking.json   issues: open `breaking` issues   pages: request a Pages rebuild
permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: breaking-watch
  cancel-in-progress: false

jobs:
  watch:
    # forks do not run this
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Poll feeds, score, alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          BREAKING_ISSUES: ${{ vars.BREAKING_ISSUES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then args="--force"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then args="$args --dry-run"; fi
          if [ "${{ inputs.bootstrap }}" = "true" ]; then args="$args --bootstrap"; fi
          python3 tools/breaking_watch.py $args

      - name: Commit state + breaking.json
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json docs/breaking.json
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "breaking-watch: update $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          # main may have moved (a human push or the packet publish): rebase and retry a few times
          for i in 1 2 3 4; do
            if git push origin HEAD:main; then echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            git pull --rebase origin main || { git rebase --abort 2>/dev/null; break; }
            sleep $((i * 3))
          done
          echo "push failed after retries"; exit 1

      # Pages publishes from main /docs (legacy branch build). A push made with the workflow token may not
      # start the Pages build, and [skip ci] can suppress it, so ask for a build explicitly. Best effort.
      - name: Ask Pages to rebuild
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent && echo "Pages build requested"
