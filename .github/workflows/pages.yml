# Deploys docs/ to GitHub Pages.
# workflow_dispatch only: this private repo's token could not enable Pages
# (HTTP 403, "Resource not accessible by integration"). Running it on every
# push would fail until Pages is allowed. Do not make the repo public to
# get around that.
name: Deploy studio

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
