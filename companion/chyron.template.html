<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=1920,height=1080">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: https:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self' https://ntfy.sh http://127.0.0.1:*">
<title>DITM Chyron (OBS browser source, 1920x1080, transparent)</title>
<style>
@property --acc{syntax:'<color>';inherits:true;initial-value:#3a6ea5}
html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
body{font-family:Inter,'Noto Sans','Segoe UI','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
#lt{position:absolute;left:30px;bottom:26px;width:1470px;display:flex;align-items:stretch;opacity:0;transform:translateY(60px);transition:opacity .45s ease,transform .55s cubic-bezier(.2,.8,.2,1);--acc:#3a6ea5;transition-property:opacity,transform,--acc;}
#lt.in{opacity:1;transform:none}
#bar{flex:1 1 auto;min-width:0;position:relative;display:flex;align-items:center;border-radius:14px;border-top:5px solid var(--acc);overflow:hidden;
 background:linear-gradient(95deg,#0b1a36 0%,#10294f 52%,color-mix(in srgb,var(--acc) 62%,#10294f) 135%);box-shadow:0 8px 28px rgba(0,0,0,.45);clip-path:inset(0 100% 0 0);transition:clip-path .7s cubic-bezier(.3,.9,.2,1) .08s}
#lt.in #bar{clip-path:inset(0 0 0 0)}
#bar:before{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,0));pointer-events:none}
#txt{position:relative;padding:15px 34px 17px 32px;min-width:0;width:100%;box-sizing:border-box;transition:opacity .26s ease,transform .26s ease}
#txt.swap{opacity:0;transform:translateY(9px)}
#kick{font-size:23px;line-height:1.1;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#ffd23f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
#head{font-size:38px;line-height:1.14;font-weight:800;color:#fff;letter-spacing:-.005em;white-space:nowrap;overflow:hidden}
#head.two,#sub.two{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
#sub{font-size:27px;line-height:1.2;font-weight:500;color:#d6e3f5;margin-top:5px;white-space:nowrap;overflow:hidden}
#sub:empty,#kick:empty{display:none}
#lg{position:absolute;right:40px;bottom:40px;height:170px;width:auto;display:block;opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease;pointer-events:none;filter:drop-shadow(0 3px 10px rgba(0,0,0,.5))}
#lg.on{opacity:1;transform:none}
#call{position:absolute;right:48px;bottom:236px;width:380px;border-radius:14px;overflow:hidden;background:linear-gradient(170deg,#0b1a36,#10294f);box-shadow:0 10px 34px rgba(0,0,0,.55);border-top:5px solid #c1121f;opacity:0;transform:translateX(460px);transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .4s ease;pointer-events:none}
#call.on{opacity:1;transform:none}
#call .hd{display:flex;align-items:center;gap:10px;background:#c1121f;color:#fff;font-weight:900;font-size:22px;letter-spacing:.12em;padding:8px 16px}
#call .hd svg{width:26px;height:26px;fill:#fff;flex:none}
#call .ph{position:relative;width:380px;height:285px;background:#0a1530;display:flex;align-items:center;justify-content:center;overflow:hidden}
#call .ph svg{width:150px;height:150px;fill:#3b5b8a}
#call .ph img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:none}
#call .ph img.ok{display:block}
#call .nm{padding:12px 18px 4px;font-size:34px;line-height:1.1;font-weight:800;color:#fff;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;text-overflow:ellipsis;overflow-wrap:normal;word-break:normal;hyphens:none}
#call .tt{padding:0 18px 14px;font-size:23px;line-height:1.2;font-weight:600;color:#ffd23f;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;text-overflow:ellipsis;overflow-wrap:normal;word-break:normal;hyphens:none}
#call .tt:empty{display:none}
#dbg{position:absolute;right:6px;top:6px;font:14px monospace;color:#0f0;background:rgba(0,0,0,.6);padding:2px 6px;display:none}
</style></head><body>
<div id="lt" aria-live="polite"><div id="bar"><div id="txt"><div id="kick"></div><div id="head"></div><div id="sub"></div></div></div></div>
<img id="lg" alt="Drew in the Morning" src="__LOGO__">
<div id="call" aria-live="polite"><div class="hd"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></svg>ON THE PHONE</div><div class="ph"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c0-4.7 3.8-7.4 8.5-7.4s8.5 2.7 8.5 7.4z"/></svg><img id="cph" alt="" referrerpolicy="no-referrer"></div><div class="nm" id="cnm"></div><div class="tt" id="ctt"></div></div>
<div id="dbg"></div>
<script>
window.DITM_DATA=__DATA__;
(function(){'use strict';
var D=window.DITM_DATA,B=D.blocks,N=B.length,$=function(i){return document.getElementById(i)};
var Q={};location.search.replace(/^\?/,'').split('&').forEach(function(p){var k=p.split('=');if(k[0])Q[decodeURIComponent(k[0])]=decodeURIComponent(k[1]||'')});
var TOPIC=/^[A-Za-z0-9_-]{6,64}$/.test(Q.topic||'')?Q.topic:null,BASE=/^(https:\/\/ntfy\.sh|http:\/\/127\.0\.0\.1:\d+)$/.test(Q.ntfy||'')?Q.ntfy:'https://ntfy.sh';
var KEY='ditm-chyron-state-v1',CMDS={start:1,stop:1,hold:1,resume:1,toggle:1,logo:1,item:1,guest:1,guest_show:1,guest_hide:1,caller:1,caller_show:1,caller_hide:1,caller_toggle:1,next:1,prev:1,goto:1,clear:1,show:1};
/* state: running = auto-advance on the run-of-show clock; held freezes the topic and the clock; idx is the topic shown; visible = lower third on screen */
var S={running:false,held:false,startAt:0,heldAt:0,holdMs:0,idx:0,visible:false,logo:false,item:null,gshow:false,gHeld:false,cshow:false,seq:0};
try{var o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&typeof o.idx==='number'){S=o;S.visible=false;S.logo=false;S.item=null;S.gshow=false;S.gHeld=false;S.cshow=false;if(S.running&&!S.held&&(Date.now()-S.startAt)/60000>=D.total)S.running=false}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function ref(){return S.held?S.heldAt:Date.now()}
function elapsedMin(){return (ref()-S.startAt-S.holdMs)/60000}
function idxAt(m){var k=-1;for(var i=0;i<N;i++)if(B[i].offset<=m+1e-9)k=i;return k}
function clampI(i){return Math.max(0,Math.min(N-1,i|0))}
/* ---- audible items: the dashboard sends only an id; the words come from chyron-items.json (published with the packet), never from the network message ---- */
var ITEMS={},ITEM_RX=/^i-[0-9a-f]{10}$/,itemsAt=0,IURL=/^http:\/\/127\.0\.0\.1:\d+\/chyron-items\.json$/.test(Q.itemsurl||'')?Q.itemsurl:'chyron-items.json';
function cl(v,n){return (typeof v==='string')?v.replace(/[\u0000-\u001f]+/g,' ').trim().slice(0,n):''}
function setItems(j){var m=(j&&typeof j==='object'&&j.items&&typeof j.items==='object')?j.items:null;if(!m)return 0;var o={},n=0;
 Object.keys(m).forEach(function(k){var v=m[k];if(!ITEM_RX.test(k)||!v||typeof v!=='object')return;var h=cl(v.headline,140);if(!h)return;o[k]={headline:h,line:cl(v.line,170),kicker:cl(v.kicker,48)};n++});
 ITEMS=o;return n}
var loading=false,waiters=[];
function loadItems(then){if(then)waiters.push(then);if(loading)return;itemsAt=Date.now();
 var done=function(){loading=false;var w=waiters;waiters=[];w.forEach(function(f){f()})};
 if(!(/^https?:/.test(location.protocol)||IURL!=='chyron-items.json')){done();return}
 loading=true;try{fetch(IURL+(IURL.indexOf('?')<0?'?t=':'&t=')+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){if(j)setItems(j);done()}).catch(done)}catch(e){done()}}
/* ---- guest + phone caller: the ONLY free text this page accepts, and only from these commands (length-capped, control chars stripped, shown with textContent, photo = https URL only) ---- */
var GKEY='ditm-chyron-guest-v1',CKEY='ditm-chyron-caller-v1',G=null,C=null;
function ctext(v,n){return (typeof v==='string')?v.replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff]+/g,' ').replace(/\s+/g,' ').trim().slice(0,n):''}
function cphoto(v){if(typeof v!=='string'||v.length>1000||/[\s"'<>\\]/.test(v))return '';try{var u=new URL(v);return (u.protocol==='https:'&&u.hostname&&!u.username&&!u.password)?u.href:''}catch(e){return ''}}
function lget(k){try{var o=JSON.parse(localStorage.getItem(k)||'null');return(o&&typeof o==='object')?o:null}catch(e){return null}}
function lset(k,o){try{localStorage.setItem(k,JSON.stringify(o))}catch(e){}}
(function(){var g=lget(GKEY);if(g&&ctext(g.name,60))G={name:ctext(g.name,60),title:ctext(g.title,80),blurb:ctext(g.blurb,140)};var c=lget(CKEY);if(c&&ctext(c.name,60))C={name:ctext(c.name,60),title:ctext(c.title,80),photo:cphoto(c.photo)}})();
function drawCall(){var el=$('call');if(!el)return;if(C){$('cnm').textContent=C.name;$('ctt').textContent=C.title;var im=$('cph');im.classList.remove('ok');im.onload=function(){im.classList.add('ok')};im.onerror=function(){im.classList.remove('ok')};
  var want=C.photo||'';if((im.getAttribute('data-src')||'')!==want){im.setAttribute('data-src',want);if(want)im.src=want;else im.removeAttribute('src')}else if(want&&im.complete&&im.naturalWidth>0)im.classList.add('ok');
  fit($('cnm'),34,24)}
 el.classList.toggle('on',!!(S.cshow&&C))}
/* ---- drawing ---- */
var shown=null,swapT=null;
function fit(el,max,min,lines){el.classList.remove('two');el.style.fontSize=max+'px';var s=max;while(el.scrollWidth>el.clientWidth+1&&s>min){s-=1;el.style.fontSize=s+'px'}if(el.scrollWidth>el.clientWidth+1){el.classList.add('two')}}
function paint(b){$('kick').textContent=b.kicker||'';$('head').textContent=b.headline||'';$('sub').textContent=b.sub||'';fit($('head'),38,32);fit($('sub'),27,23);$('lt').style.setProperty('--acc',b.color)}
function cur(){if(S.gshow&&G)return{key:'g:'+G.name+'|'+G.title+'|'+G.blurb,b:{headline:G.name,kicker:G.title||'GUEST',sub:G.blurb,color:'#2a7de1'}};if(S.item&&ITEMS[S.item]){var t=ITEMS[S.item];return{key:'i:'+S.item,b:{headline:t.headline,sub:t.line,kicker:t.kicker||'ON THE DESK',color:'#e4572e'}}}var b=B[S.idx];return b?{key:'b:'+S.idx,b:b}:null}
function draw(){var lt=$('lt'),c=cur();if(!c)return;
 if(S.visible){if(shown===null){clearTimeout(swapT);paint(c.b);shown=c.key;lt.classList.add('in')}
  else if(shown!==c.key){var t=$('txt');t.classList.add('swap');clearTimeout(swapT);var want=c;swapT=setTimeout(function(){paint(want.b);shown=want.key;t.classList.remove('swap')},260)}}
 else if(shown!==null||lt.classList.contains('in')){lt.classList.remove('in');shown=null}
 $('lg').classList.toggle('on',!!S.logo);drawCall();
 var d=$('dbg');if(Q.debug){d.style.display='block';d.textContent=JSON.stringify(view())}
 publishSoon()}
function view(){return{running:S.running,held:S.held,idx:S.idx,letter:B[S.idx]&&B[S.idx].letter,visible:S.visible,logo:!!S.logo,item:S.item&&ITEMS[S.item]?S.item:null,guest:(S.gshow&&G)?G.name:null,caller:(S.cshow&&C)?C.name:null,hasCaller:!!C,hasGuest:!!G,startAt:S.startAt,heldAt:S.heldAt,holdMs:S.holdMs,elapsedMin:+elapsedMin().toFixed(3)}}
/* ---- commands (a fixed list; nothing else is ever accepted) ---- */
function apply(c,again){var now=Date.now();if(!c||typeof c.cmd!=='string'||!Object.prototype.hasOwnProperty.call(CMDS,c.cmd))return false;var i=(typeof c.idx==='number'&&isFinite(c.idx))?clampI(c.idx):null;
 switch(c.cmd){
  case 'start':S.running=true;S.held=false;S.holdMs=0;S.heldAt=0;S.startAt=Math.floor(now/60000)*60000;S.idx=0;S.visible=true;S.logo=false;S.item=null;S.gshow=false;S.gHeld=false;break;
  case 'stop':S.running=false;S.held=false;S.holdMs=0;S.heldAt=0;break;
  case 'hold':if(S.running&&!S.held){S.held=true;S.heldAt=now}S.gHeld=false;break;
  case 'toggle':return apply({cmd:S.held?'resume':'hold'});   /* one Stream Deck key for hold/resume */
  case 'resume':if(S.held){S.holdMs+=now-S.heldAt;S.held=false;S.heldAt=0}S.item=null;S.gshow=false;S.gHeld=false;break;   /* resume also leaves an audible or a guest: back to the scheduled block */
  case 'next':case 'prev':case 'goto':{if(c.cmd==='goto'&&i===null)return false;var to=c.cmd==='goto'?(i===null?S.idx:i):clampI(S.idx+(c.cmd==='next'?1:-1));S.idx=to;S.visible=true;S.logo=false;S.item=null;S.gshow=false;S.gHeld=false;
   if(S.running)S.startAt=ref()-S.holdMs-B[to].offset*60000+1;break}   /* +1ms: land inside the block, not on the boundary */
  case 'clear':S.visible=false;S.logo=false;S.item=null;S.gshow=false;S.gHeld=false;break;
  case 'logo':S.visible=false;S.logo=true;S.item=null;S.gshow=false;S.gHeld=false;break;   /* bar off, only the small DITM sun bug bottom-right; auto-advance keeps running underneath */
  case 'item':{var id=c.id;if(typeof id!=='string'||!ITEM_RX.test(id))return false;
   if(!ITEMS[id]){if(!again&&(loading||Date.now()-itemsAt>15000))loadItems(function(){apply(c,true)});return false}   /* unknown id: ignored (one cache-busted refresh is tried first) */
   S.item=id;S.gshow=false;S.visible=true;S.logo=false;if(S.running&&!S.held){S.held=true;S.heldAt=now;S.gHeld=false}   /* auto-advance holds so the audible stays up */
   break}
  case 'guest':case 'guest_show':{if(c.cmd==='guest'){var n=ctext(c.name,60);if(!n)return false;G={name:n,title:ctext(c.title,80),blurb:ctext(c.blurb,140)};lset(GKEY,G)}else if(!G)return false;
   S.gshow=true;S.item=null;S.visible=true;S.logo=false;if(S.running&&!S.held){S.held=true;S.heldAt=now;S.gHeld=true}   /* a guest holds auto-advance, like an audible */
   break}
  case 'guest_hide':{if(!S.gshow)return false;S.gshow=false;if(S.held&&S.gHeld){S.holdMs+=now-S.heldAt;S.held=false;S.heldAt=0}S.gHeld=false;S.visible=!!S.running;break}   /* back to the rundown if it is running, else off air */
  case 'caller':{var cn=ctext(c.name,60);if(!cn)return false;C={name:cn,title:ctext(c.title,80),photo:cphoto(c.photo)};lset(CKEY,C);S.cshow=true;break}
  case 'caller_show':if(!C)return false;S.cshow=true;break;
  case 'caller_hide':S.cshow=false;break;
  case 'caller_toggle':if(!C)return false;S.cshow=!S.cshow;break;
  case 'show':S.visible=true;S.logo=false;break}
 S.seq++;save();draw();return true}
function tick(){if(!S.running)return;var m=elapsedMin();
 if(m>=D.total){S.running=false;S.held=false;S.visible=false;S.seq++;save();draw();return}
 var k=idxAt(m);if(k>=0&&k!==S.idx){S.idx=k;S.seq++;save();draw()}}
setInterval(tick,250);
/* ---- input (a): obs-browser events, sent by obs-websocket CallVendorRequest vendorName obs-browser requestType emit_event ---- */
window.addEventListener('ditm',function(e){var d=e&&e.detail;if(typeof d==='string'){try{d=JSON.parse(d)}catch(x){return}}apply(d&&{cmd:d.cmd,idx:d.idx,id:d.id,name:d.name,title:d.title,blurb:d.blurb,photo:d.photo})});
/* ---- input (b): ntfy.sh topic over EventSource ---- */
var lastPub=0,pubT=null,loadSec=Date.now()/1000;
function publishSoon(){if(!TOPIC)return;clearTimeout(pubT);pubT=setTimeout(publish,150)}
function publish(){if(!TOPIC)return;var v=view();v.k='state';v.v=1;v.at=Date.now();v.blocks=N;lastPub=Date.now();
 try{fetch(BASE+'/'+TOPIC,{method:'POST',body:JSON.stringify(v)}).catch(function(){})}catch(e){}}
if(TOPIC&&window.EventSource){var es=new EventSource(BASE+'/'+TOPIC+'/sse?since=20s');
 es.onmessage=function(ev){var m;try{m=JSON.parse(ev.data)}catch(e){return}if(!m||m.event!=='message'||!m.message)return;if(m.time&&m.time<loadSec-8)return;
  var c;try{c=JSON.parse(m.message)}catch(e){return}if(!c||c.k==='state')return;apply({cmd:String(c.cmd),idx:c.idx,id:c.id,name:c.name,title:c.title,blurb:c.blurb,photo:c.photo})}}
setInterval(function(){if(S.running&&Date.now()-lastPub>180000)publish()},30000);
/* refresh the block text from chyron.json (rebuilt daily) when this page is served over http(s) */
if(/^https?:/.test(location.protocol)){try{fetch('chyron.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){if(j&&j.blocks&&j.blocks.length===N){B=j.blocks;D.total=j.total||D.total;var cc=cur();if(shown!==null&&cc)paint(cc.b)}}).catch(function(){})}catch(e){}}
loadItems();setInterval(function(){loadItems()},600000);
window.DITM={cmd:apply,state:view,blocks:function(){return B},items:function(){return Object.keys(ITEMS).length},setItems:setItems,guest:function(){return G},caller:function(){return C}};
draw();if(TOPIC)setTimeout(publish,800);
})();
</script></body></html>
