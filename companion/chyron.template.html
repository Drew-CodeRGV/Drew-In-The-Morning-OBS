<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=1920,height=1080">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self' https://ntfy.sh http://127.0.0.1:*">
<title>DITM Chyron (OBS browser source, 1920x1080, transparent)</title>
<style>
@property --acc{syntax:'<color>';inherits:true;initial-value:#3a6ea5}
html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
body{font-family:Inter,'Noto Sans','Segoe UI','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
#lt{position:absolute;left:60px;bottom:50px;width:1440px;display:flex;align-items:stretch;opacity:0;transform:translateY(46px);transition:opacity .45s ease,transform .55s cubic-bezier(.2,.8,.2,1);--acc:#3a6ea5;transition-property:opacity,transform,--acc;}
#lt.in{opacity:1;transform:none}
#bug{flex:none;width:150px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#07122a 0%,#0d2347 100%);border-radius:14px 0 0 14px;border-top:5px solid var(--acc);box-shadow:0 8px 28px rgba(0,0,0,.45);position:relative;z-index:2;transition:border-color .6s}
#bug img{width:104px;height:auto;display:block}
#bar{flex:1 1 auto;min-width:0;position:relative;display:flex;align-items:center;border-radius:0 14px 14px 0;border-top:5px solid var(--acc);overflow:hidden;
 background:linear-gradient(95deg,#0b1a36 0%,#10294f 52%,color-mix(in srgb,var(--acc) 62%,#10294f) 135%);box-shadow:0 8px 28px rgba(0,0,0,.45);clip-path:inset(0 100% 0 0);transition:clip-path .7s cubic-bezier(.3,.9,.2,1) .08s}
#lt.in #bar{clip-path:inset(0 0 0 0)}
#bar:before{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,0));pointer-events:none}
#txt{position:relative;padding:15px 34px 17px 30px;min-width:0;width:100%;box-sizing:border-box;transition:opacity .26s ease,transform .26s ease}
#txt.swap{opacity:0;transform:translateY(9px)}
#kick{font-size:23px;line-height:1.1;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#ffd23f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
#head{font-size:38px;line-height:1.14;font-weight:800;color:#fff;letter-spacing:-.005em;white-space:nowrap;overflow:hidden}
#head.two,#sub.two{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
#sub{font-size:27px;line-height:1.2;font-weight:500;color:#d6e3f5;margin-top:5px;white-space:nowrap;overflow:hidden}
#sub:empty,#kick:empty{display:none}
#dbg{position:absolute;right:6px;top:6px;font:14px monospace;color:#0f0;background:rgba(0,0,0,.6);padding:2px 6px;display:none}
</style></head><body>
<div id="lt" aria-live="polite"><div id="bug"><img id="logo" alt="Drew in the Morning" src="__LOGO__"></div><div id="bar"><div id="txt"><div id="kick"></div><div id="head"></div><div id="sub"></div></div></div></div>
<div id="dbg"></div>
<script>
window.DITM_DATA=__DATA__;
(function(){'use strict';
var D=window.DITM_DATA,B=D.blocks,N=B.length,$=function(i){return document.getElementById(i)};
var Q={};location.search.replace(/^\?/,'').split('&').forEach(function(p){var k=p.split('=');if(k[0])Q[decodeURIComponent(k[0])]=decodeURIComponent(k[1]||'')});
var TOPIC=/^[A-Za-z0-9_-]{6,64}$/.test(Q.topic||'')?Q.topic:null,BASE=/^(https:\/\/ntfy\.sh|http:\/\/127\.0\.0\.1:\d+)$/.test(Q.ntfy||'')?Q.ntfy:'https://ntfy.sh';
var KEY='ditm-chyron-state-v1',CMDS={start:1,stop:1,hold:1,resume:1,toggle:1,next:1,prev:1,goto:1,clear:1,show:1};
/* state: running = auto-advance on the run-of-show clock; held freezes the topic and the clock; idx is the topic shown; visible = lower third on screen */
var S={running:false,held:false,startAt:0,heldAt:0,holdMs:0,idx:0,visible:false,seq:0};
try{var o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&typeof o.idx==='number'){S=o;S.visible=false;if(S.running&&!S.held&&(Date.now()-S.startAt)/60000>=D.total)S.running=false}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function ref(){return S.held?S.heldAt:Date.now()}
function elapsedMin(){return (ref()-S.startAt-S.holdMs)/60000}
function idxAt(m){var k=-1;for(var i=0;i<N;i++)if(B[i].offset<=m+1e-9)k=i;return k}
function clampI(i){return Math.max(0,Math.min(N-1,i|0))}
/* ---- drawing ---- */
var shown=-1,swapT=null;
function fit(el,max,min,lines){el.classList.remove('two');el.style.fontSize=max+'px';var s=max;while(el.scrollWidth>el.clientWidth+1&&s>min){s-=1;el.style.fontSize=s+'px'}if(el.scrollWidth>el.clientWidth+1){el.classList.add('two')}}
function paint(b){$('kick').textContent=b.kicker||'';$('head').textContent=b.headline||'';$('sub').textContent=b.sub||'';fit($('head'),38,32);fit($('sub'),27,23);$('lt').style.setProperty('--acc',b.color)}
function draw(){var lt=$('lt'),b=B[S.idx];if(!b)return;
 if(S.visible){if(shown===-1){clearTimeout(swapT);paint(b);shown=S.idx;lt.classList.add('in')}
  else if(shown!==S.idx){var t=$('txt');t.classList.add('swap');clearTimeout(swapT);var want=S.idx;swapT=setTimeout(function(){paint(B[want]);shown=want;t.classList.remove('swap')},260)}}
 else if(shown!==-1||lt.classList.contains('in')){lt.classList.remove('in');shown=-1}
 var d=$('dbg');if(Q.debug){d.style.display='block';d.textContent=JSON.stringify(view())}
 publishSoon()}
function view(){return{running:S.running,held:S.held,idx:S.idx,letter:B[S.idx]&&B[S.idx].letter,visible:S.visible,startAt:S.startAt,heldAt:S.heldAt,holdMs:S.holdMs,elapsedMin:+elapsedMin().toFixed(3)}}
/* ---- commands (a fixed list; nothing else is ever accepted) ---- */
function apply(c){var now=Date.now();if(!c||typeof c.cmd!=='string'||!Object.prototype.hasOwnProperty.call(CMDS,c.cmd))return false;var i=(typeof c.idx==='number'&&isFinite(c.idx))?clampI(c.idx):null;
 switch(c.cmd){
  case 'start':S.running=true;S.held=false;S.holdMs=0;S.heldAt=0;S.startAt=Math.floor(now/60000)*60000;S.idx=0;S.visible=true;break;
  case 'stop':S.running=false;S.held=false;S.holdMs=0;S.heldAt=0;break;
  case 'hold':if(S.running&&!S.held){S.held=true;S.heldAt=now}break;
  case 'toggle':return apply({cmd:S.held?'resume':'hold'});   /* one Stream Deck key for hold/resume */
  case 'resume':if(S.held){S.holdMs+=now-S.heldAt;S.held=false;S.heldAt=0}break;
  case 'next':case 'prev':case 'goto':{if(c.cmd==='goto'&&i===null)return false;var to=c.cmd==='goto'?(i===null?S.idx:i):clampI(S.idx+(c.cmd==='next'?1:-1));S.idx=to;S.visible=true;
   if(S.running)S.startAt=ref()-S.holdMs-B[to].offset*60000+1;break}   /* +1ms: land inside the block, not on the boundary */
  case 'clear':S.visible=false;break;
  case 'show':S.visible=true;break}
 S.seq++;save();draw();return true}
function tick(){if(!S.running)return;var m=elapsedMin();
 if(m>=D.total){S.running=false;S.held=false;S.visible=false;S.seq++;save();draw();return}
 var k=idxAt(m);if(k>=0&&k!==S.idx){S.idx=k;S.seq++;save();draw()}}
setInterval(tick,250);
/* ---- input (a): obs-browser events, sent by obs-websocket CallVendorRequest vendorName obs-browser requestType emit_event ---- */
window.addEventListener('ditm',function(e){var d=e&&e.detail;if(typeof d==='string'){try{d=JSON.parse(d)}catch(x){return}}apply(d&&{cmd:d.cmd,idx:d.idx})});
/* ---- input (b): ntfy.sh topic over EventSource ---- */
var lastPub=0,pubT=null,loadSec=Date.now()/1000;
function publishSoon(){if(!TOPIC)return;clearTimeout(pubT);pubT=setTimeout(publish,150)}
function publish(){if(!TOPIC)return;var v=view();v.k='state';v.v=1;v.at=Date.now();v.blocks=N;lastPub=Date.now();
 try{fetch(BASE+'/'+TOPIC,{method:'POST',body:JSON.stringify(v)}).catch(function(){})}catch(e){}}
if(TOPIC&&window.EventSource){var es=new EventSource(BASE+'/'+TOPIC+'/sse?since=20s');
 es.onmessage=function(ev){var m;try{m=JSON.parse(ev.data)}catch(e){return}if(!m||m.event!=='message'||!m.message)return;if(m.time&&m.time<loadSec-8)return;
  var c;try{c=JSON.parse(m.message)}catch(e){return}if(!c||c.k==='state')return;apply({cmd:String(c.cmd),idx:c.idx})}}
setInterval(function(){if(S.running&&Date.now()-lastPub>180000)publish()},30000);
/* refresh the block text from chyron.json (rebuilt daily) when this page is served over http(s) */
if(/^https?:/.test(location.protocol)){try{fetch('chyron.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){if(j&&j.blocks&&j.blocks.length===N){B=j.blocks;D.total=j.total||D.total;if(shown>=0)paint(B[S.idx])}}).catch(function(){})}catch(e){}}
window.DITM={cmd:apply,state:view,blocks:function(){return B}};
draw();if(TOPIC)setTimeout(publish,800);
})();
</script></body></html>
