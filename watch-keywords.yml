# Keyword watch filters for tools/breaking_watch.py. Case-insensitive, whole-word. "*" at the end = any ending
# (evacuat* matches evacuate, evacuation, evacuated). A space matches any whitespace.
#
# How they combine (see BREAKING-WATCH.md):
#   ALERT (push + issue)  = score Hot, OR geo + urgent (urgent word in the headline), OR an always_alert term with a geo term or "Texas"
#   WATCH (dashboard strip only) = any theme, OR Uncovered, OR geo + score Trending
# geo_ambiguous terms are ordinary words too, so they only count when the story comes from a local outlet
# or another place name / theme also appears.

geo:
